<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实时字幕 · 系统音频</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --size: 34px; --en: 0.62; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0c0e; color: #f2f4f7;
               font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", system-ui, sans-serif; }
  #wrap { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; gap: 14px; align-items: center; padding: 8px 14px;
           font-size: 13px; color: #8b93a1; background: #101216; border-bottom: 1px solid #1c1f26; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #d33; display: inline-block; }
  .dot.on { background: #2ecc71; }
  .meter { width: 90px; height: 6px; background: #1c1f26; border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0%; background: #2ecc71; transition: width .1s; }
  header button { background: #1a1d24; color: #cfd6e0; border: 1px solid #262b34;
                  border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
  header button:hover { background: #232833; }
  header .spacer { flex: 1; }
  #stage { flex: 1; overflow-y: auto; padding: 3vh 4vw 18vh; scroll-behavior: smooth; }
  .line { margin: 0 0 1.1em; opacity: .5; transition: opacity .25s; }
  .line:last-child, .line.active { opacity: 1; }
  .zh { font-size: var(--size); line-height: 1.35; letter-spacing: .01em; }
  .en { font-size: calc(var(--size) * var(--en)); line-height: 1.35; color: #8b93a1; margin-top: .15em; }
  .pending .zh { color: #6b7480; }
  #buffer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 4vw 14px;
            background: linear-gradient(to top, #0b0c0e 55%, rgba(11,12,14,0)); pointer-events: none; }
  #buffer div { font-size: calc(var(--size) * .72); color: #7c8593; line-height: 1.3; }
  .empty { color: #4b525c; font-size: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="dot" id="dot"></span><span id="status">连接中…</span>
    <span class="meter"><i id="meter"></i></span>
    <span class="spacer"></span>
    <button id="smaller">A-</button><button id="bigger">A+</button><button id="clear">清屏</button>
  </header>
  <div id="stage"><div class="empty" id="empty">等待系统音频中的语音…（播放视频/会议音频即可）</div></div>
  <div id="buffer"><div id="buftext"></div></div>
</div>
<script>
const stage = document.getElementById('stage');
const state = { lines: [], buffer: '', lastKey: '' };
let fontSize = parseFloat(localStorage.getItem('subFont') || '34');
function applySize() { document.documentElement.style.setProperty('--size', fontSize + 'px');
  localStorage.setItem('subFont', String(fontSize)); }
applySize();
document.getElementById('bigger').onclick = () => { fontSize = Math.min(72, fontSize + 3); applySize(); };
document.getElementById('smaller').onclick = () => { fontSize = Math.max(16, fontSize - 3); applySize(); };
document.getElementById('clear').onclick = () => { stage.innerHTML = ''; };

// 每一行固定两条：中文一条、源语言一条；源语言本身是中文就只出中文那一条。
function makeRow(zh, en, active, pending) {
  const row = document.createElement('div');
  row.className = 'line' + (active ? ' active' : '') + (pending ? ' pending' : '');
  const a = document.createElement('div'); a.className = 'zh';
  a.textContent = zh || en;             // 中文还没回来先用源语言顶上，不留空行
  row.appendChild(a);
  if (zh && en) {
    const b = document.createElement('div'); b.className = 'en';
    b.textContent = en;
    row.appendChild(b);
  }
  return row;
}

function render(d) {
  const key = JSON.stringify([d.lines.length, d.lines.map(l => l.en.length + ':' + l.zh.length).join(),
                              d.cap_src, d.cap_zh, d.same_lang]);
  if (key !== state.lastKey) {
    state.lastKey = key;
    stage.innerHTML = '';
    if (!d.lines.length && !d.cap_src) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = '等待系统音频中的语音…（播放视频/会议音频即可）'; stage.appendChild(e);
    }
    if (d.same_lang) {                  // 源语言就是中文：只有一条
      d.lines.forEach(l => stage.appendChild(makeRow('', l.en, false, false)));
      if (d.cap_src) stage.appendChild(makeRow('', d.cap_src, true, false));
    } else {
      d.lines.filter(l => l.en !== d.cap_src)
        .forEach(l => stage.appendChild(makeRow(l.zh, l.en, false, !l.zh)));
      if (d.cap_src) stage.appendChild(makeRow(d.cap_zh, d.cap_src, true, !d.cap_zh));
    }
    stage.scrollTop = stage.scrollHeight;
  }
  document.getElementById('buftext').textContent = d.buffer || '';
  document.getElementById('dot').className = 'dot' + (d.asr && d.level > 0.002 ? ' on' : '');
  document.getElementById('status').textContent = d.asr
      ? (d.level > 0.002 ? '采集中' : '音频静音') : (d.status || '等待 ASR 服务');
  document.getElementById('meter').style.width = Math.min(100, d.level * 320) + '%';
}

function connect() {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onmessage = ev => { try { render(JSON.parse(ev.data)); } catch (e) {} };
  ws.onopen = () => { document.getElementById('status').textContent = '已连接'; };
  ws.onclose = () => { document.getElementById('status').textContent = '服务断开，重连中…';
    document.getElementById('dot').className = 'dot'; setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
